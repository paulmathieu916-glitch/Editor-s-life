name: Build Editors Life APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: |
          unzip EditorsLife-Android-Project.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Find and build Android project
        run: |
          GRADLE=$(find project -type f -name gradlew | head -1)
          if [ -z "$GRADLE" ]; then
            echo "ERREUR: gradlew introuvable dans le ZIP"
            exit 1
          fi
          chmod +x "$GRADLE"
          cd "$(dirname "$GRADLE")"
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Editors-Life-APK
          path: project/**/build/outputs/apk/debug/*.apk
